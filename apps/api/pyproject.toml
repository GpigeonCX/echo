[project]
name = "echo-api"
version = "0.1.0"
description = "Personal investment assistant API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.28.1",
  "uvicorn[standard]>=0.35.0",
  "sqlalchemy>=2.0.41",
  "pydantic-settings>=2.10.1",
  "pymysql>=1.1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
